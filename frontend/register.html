
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerNest - Create Account</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="auth-header">
        <a href="index.html" class="logo">Career<span>Nest</span></a>
        <button id="themeToggle" class="theme-btn">🌙</button>
    </header>

    <main class="auth-container">

        <div class="auth-card">
            <div class="auth-icon">🚀</div>

            <h1>Create Account</h1>
            <p class="auth-subtitle">
                Start your career journey with CareerNest
            </p>

            <div id="message" class="message"></div>

            <form id="registerForm">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name"
                        placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email"
                        placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-box">
                        <input type="password" id="password"
                            placeholder="Minimum 6 characters" required>
                        <button type="button" class="show-password"
                            onclick="togglePassword('password', this)">Show</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-box">
                        <input type="password" id="confirmPassword"
                            placeholder="Confirm your password" required>
                        <button type="button" class="show-password"
                            onclick="togglePassword('confirmPassword', this)">Show</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Register As</label>
                    <select id="role" required>
                        <option value="jobseeker">Job Seeker</option>
                        <option value="employer">Employer</option>
                    </select>
                </div>

                <button type="submit" class="primary-btn" id="registerBtn">
                    Create Account
                </button>

            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Login Now</a>
            </p>

        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
